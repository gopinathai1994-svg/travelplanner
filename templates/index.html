<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner | Premium Multi-Agent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1b4b; }
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
        
        /* Markdown Styling */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #a78bfa; margin-top: 1rem; font-weight: bold;}
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; color: #e2e8f0;}
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; color: #cbd5e1;}
        .markdown-body a { color: #60a5fa; text-decoration: underline;}
        .markdown-body strong { color: #f8fafc;}
    </style>
</head>
<body class="text-white">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <header class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-5xl font-bold neon-text bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                AI Travel Planner
            </h1>
            <p class="text-gray-400 mt-3 text-lg">Powered by LangGraph Multi-Agent System & Gemini AI</p>
        </header>

        <!-- Input Form -->
        <div class="glass rounded-2xl p-8 mb-8 shadow-2xl" data-aos="fade-up">
            <form id="travelForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">From (Origin)</label>
                    <input type="text" id="from_loc" value="Mumbai" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">To (Destination)</label>
                    <input type="text" id="to_loc" value="Ooty" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Vehicle Type</label>
                    <select id="vehicle" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                        <option value="car">Car</option>
                        <option value="bike">Bike</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Start Date</label>
                        <input type="date" id="start_date" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">End Date</label>
                        <input type="date" id="end_date" required class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:outline-none transition">
                    </div>
                </div>
                <div class="md:col-span-2 mt-4">
                    <button type="submit" id="submitBtn" class="w-full btn-glow bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-lg transition-all duration-300 transform hover:scale-[1.02]">
                        🚀 Generate Premium Travel Plan
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mb-4"></div>
            <p class="text-purple-300 text-lg">Multi-Agents are planning your trip... Please wait.</p>
            <p class="text-gray-500 text-sm mt-2">Researching → Calculating Fuel → Finding Hotels → Finalizing</p>
        </div>

        <!-- Output Result -->
        <div id="result" class="glass rounded-2xl p-8 shadow-2xl hidden" data-aos="fade-up">
            <h2 class="text-2xl font-bold text-purple-400 mb-4">🗺️ Your Premium Itinerary</h2>
            <div id="markdown-output" class="markdown-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Set default dates (Today to +5 days)
        const today = new Date();
        const nextWeek = new Date(today.getTime() + 5 * 24 * 60 * 60 * 1000);
        document.getElementById('start_date').valueAsDate = today;
        document.getElementById('end_date').valueAsDate = nextWeek;

        document.getElementById('travelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // UI Updates
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";
            loading.classList.remove('hidden');
            result.classList.add('hidden');

            const payload = {
                from_loc: document.getElementById('from_loc').value,
                to_loc: document.getElementById('to_loc').value,
                vehicle: document.getElementById('vehicle').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value
            };

            try {
                const response = await fetch('/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('markdown-output').innerHTML = marked.parse(data.plan);
                    result.classList.remove('hidden');
                    AOS.refresh();
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                alert("Network Error: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Generate Premium Travel Plan";
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
